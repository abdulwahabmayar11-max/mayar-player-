<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ویدیو پلیر آفلاین MAYAR</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #11141a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* قاب استاندارد گوشی */
        .phone-container {
            width: 100%;
            max-width: 410px;
            height: calc(410px * 16 / 9);
            max-height: 820px;
            background: #171b26;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px;
            box-sizing: border-box;
        }

        .brand-name {
            color: #29b6f6;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            font-family: 'Arial Black', sans-serif;
        }

        /* المان پخش ویدیو */
        video {
            width: 100%;
            border-radius: 15px;
            background: #000000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: none; /* ابتدا مخفی است تا ویدیو انتخاب شود */
        }

        /* دکمه انتخاب فایل */
        .file-select-btn {
            background: #222836;
            border: 2px dashed #29b6f6;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: background 0.3s;
        }

        .file-select-btn:active {
            background: #1e2538;
        }

        .file-select-btn p {
            margin: 0;
            color: #6c7a9c;
            font-size: 16px;
        }

        input[type="file"] {
            display: none;
        }

        .footer {
            text-align: center;
            font-size: 15px;
            color: #6c7a9c;
            margin-top: 20px;
            border-top: 1px solid #222836;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        
        <div class="brand-name">Abdulwahab Mayar</div>

        <!-- بخش انتخاب ویدیو از حافظه گوشی -->
        <label class="file-select-btn" id="uploadBox">
            <input type="file" id="videoInput" accept="video/*">
            <p>📁 برای انتخاب ویدیو از حافظه گوشی کلیک کنید</p>
        </label>

        <!-- نمایش‌دهنده ویدیو پلیر -->
        <video id="videoPlayer" controls></video>

        <div class="footer">
            Abdulwahab Mayar
        </div>

    </div>

    <script>
        const videoInput = document.getElementById('videoInput');
        const videoPlayer = document.getElementById('videoPlayer');
        const uploadBox = document.getElementById('uploadBox');

        videoInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                // تبدیل فایل محلی گوشی به آدرس قابل پخش در برنامه
                const fileURL = URL.createObjectURL(file);
                videoPlayer.src = fileURL;
                
                // پنهان کردن باکس آپلود و نشان دادن پلیر
                uploadBox.style.display = 'none';
                videoPlayer.style.display = 'block';
                
                videoPlayer.play();
            }
        });
    </script>

</body>
</html>
